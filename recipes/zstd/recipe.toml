name        = "zstd"
version     = "1.5.6"
description = "Zstandard compression library (static)"
license     = "BSD-3-Clause OR GPL-2.0-only"
libc        = ["musl"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "musl", "linux-headers"]

[[source]]
url    = "https://github.com/facebook/zstd/releases/download/v1.5.6/zstd-1.5.6.tar.gz"
sha256 = "8c29e06cf42aacc1eafc4077ae2ec6c6fcb96a626157e0593d5e82a34fd403c1"

[build]
compile = "make -C lib -j$JOBS libzstd.a CFLAGS='-O2'"
install = '''
make -C lib install-static install-includes install-pc PREFIX=/usr DESTDIR=$DESTDIR
test -f "$DESTDIR/usr/lib/libzstd.a"
'''
