# wpa_supplicant 2.12 with its own TLS and crypto (no OpenSSL): WPA2 personal (PSK, which also
# joins WPA3 transition-mode networks) and the common WPA-Enterprise methods (PEAP, TTLS, MSCHAPv2,
# GTC, TLS). NO WPA3-only (SAE) or OWE: the built-in crypto lacks what they need; that takes OpenSSL
# or wolfSSL. Static, nl80211 only.
name        = "wpa_supplicant"
version     = "2.12"
description = "Wi-Fi supplicant (wpa_supplicant, wpa_cli, wpa_passphrase)"
license     = "BSD-3-Clause"
libc        = ["musl"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "musl", "linux-headers", "pkgconf", "libnl"]

[[source]]
url    = "https://w1.fi/releases/wpa_supplicant-2.12.tar.gz"
sha256 = "08e23937e16d0155e55cab2b51f51fbe10d80a1aa91c4e15442645059b737ef6"

[build]
configure = '''
cd wpa_supplicant
cat > .config <<'CONF'
CONFIG_DRIVER_NL80211=y
CONFIG_LIBNL32=y
CONFIG_CTRL_IFACE=y
CONFIG_BACKEND=file
CONFIG_TLS=internal
CONFIG_INTERNAL_LIBTOMMATH=y
CONFIG_INTERNAL_LIBTOMMATH_FAST=y
CONFIG_IEEE80211W=y
CONFIG_IEEE80211N=y
CONFIG_IEEE80211AC=y
CONFIG_IEEE80211AX=y
CONFIG_EAP_MD5=y
CONFIG_EAP_MSCHAPV2=y
CONFIG_EAP_TLS=y
CONFIG_EAP_PEAP=y
CONFIG_EAP_TTLS=y
CONFIG_EAP_GTC=y
CONFIG_PKCS12=y
CONFIG_SMARTCARD=n
CONF
'''
compile = "make -C wpa_supplicant -j$JOBS CC=gcc LDFLAGS=-static"
install = '''
mkdir -p "$DESTDIR/usr/sbin" "$DESTDIR/usr/bin"
install -m 755 wpa_supplicant/wpa_supplicant wpa_supplicant/wpa_cli "$DESTDIR/usr/sbin/"
install -m 755 wpa_supplicant/wpa_passphrase "$DESTDIR/usr/bin/"
strip "$DESTDIR"/usr/sbin/wpa_supplicant "$DESTDIR"/usr/sbin/wpa_cli "$DESTDIR"/usr/bin/wpa_passphrase
for f in usr/sbin/wpa_supplicant usr/sbin/wpa_cli usr/bin/wpa_passphrase; do
    if readelf -lW "$DESTDIR/$f" | grep -q INTERP; then echo "$f is dynamic" >&2; exit 1; fi
done
'''
