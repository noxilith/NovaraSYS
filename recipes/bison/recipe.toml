name        = "bison"
version     = "3.8.2"
description = "GNU parser generator"
license     = "GPL-3.0-or-later"
libc        = ["musl"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "musl", "linux-headers", "m4"]

[[source]]
url    = "https://ftp.gnu.org/gnu/bison/bison-3.8.2.tar.xz"
sha256 = "9bba0214ccf7f1079c5d59210045227bcf619519840ebfa80cd3849cff5a5bf2"

[build]
configure = "M4=/usr/bin/m4 ./configure --prefix=/usr --disable-nls --disable-yacc --disable-dependency-tracking CFLAGS='-O2 -std=gnu17' LDFLAGS=--static"
compile   = "make -j$JOBS"
install   = '''
make DESTDIR=$DESTDIR install
rm -rf "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/doc" "$DESTDIR/usr/share/aclocal" "$DESTDIR/usr/lib"
strip "$DESTDIR/usr/bin/bison"
test -x "$DESTDIR/usr/bin/bison"
test -d "$DESTDIR/usr/share/bison"
'''
