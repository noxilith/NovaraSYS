# Stage 0 BusyBox: one static binary that provides the shell and the core
# utilities, so the first store-based builds have tools. Built with the host
# compiler: with musl for the musl variant (musl is built first, inside this
# recipe), or a plain static link for the glibc variant.
name        = "busybox-stage0"
version     = "1.36.1_r1"
description = "BusyBox: a static shell and core utilities"
license     = "GPL-2.0-only"
libc        = ["musl", "glibc"]

[[source]]
url    = "https://busybox.net/downloads/busybox-1.36.1.tar.bz2"
# Matches the checksum busybox.net publishes next to the tarball.
sha256 = "b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314"

# Only used by the musl variant (see below); listed here because sources are
# the same for every libc.
[[source]]
url    = "https://musl.libc.org/releases/musl-1.2.5.tar.gz"
sha256 = "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4"

[build]
prepare = '''
make defconfig
# Static; without `tc` (no longer builds against current kernel headers) and
# without the `strings` applet, which binutils provides: two packages may not
# supply the same file, and the real tool should win.
sed -i -e 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' -e 's/^CONFIG_TC=y/# CONFIG_TC is not set/' -e 's/^CONFIG_STRINGS=y/# CONFIG_STRINGS is not set/' .config
'''
compile = "make -j$JOBS CC=gcc"
install = "make CONFIG_PREFIX=$DESTDIR install"

[libc_override.musl]
prepare = '''
# Stage 0: build musl with the host compiler into /build/musl, together with
# its `musl-gcc` wrapper, and compile this package against it. (`DESTDIR=` is
# set explicitly: forge exports DESTDIR to every step, and `make` would otherwise
# install this helper copy of musl inside the package's own output.)
mkdir -p /build/musl-src
tar -xzf /sources/musl-1.2.5.tar.gz -C /build/musl-src
(cd /build/musl-src/musl-1.2.5 && ./configure --prefix=/build/musl --disable-shared && make -j"$JOBS" && make DESTDIR= install)
# Newer gcc links libatomic by default from the *system* library directory,
# which a musl build must not search. Keep gcc's default link sequence, minus that.
cat >> /build/musl/lib/musl-gcc.specs <<'SPECS'
*link_gcc_c_sequence:
%{static|static-pie:--start-group} %G %L %{static|static-pie:--end-group}%{!static:%{!static-pie:%G}}

SPECS
# The kernel API headers come from the host in stage 0.
for d in asm asm-generic linux mtd; do
    for base in /usr/include /usr/include/x86_64-linux-gnu; do
        if [ -d "$base/$d" ]; then cp -R "$base/$d" /build/musl/include/; break; fi
    done
done
make defconfig
sed -i -e 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' -e 's/^CONFIG_TC=y/# CONFIG_TC is not set/' -e 's/^CONFIG_STRINGS=y/# CONFIG_STRINGS is not set/' .config
'''
compile = "make -j$JOBS CC=/build/musl/bin/musl-gcc"
# `make install` must get the same CC: BusyBox notices a changed compiler and
# rebuilds everything, which would silently swap the musl binary for a glibc one.
install = '''
make CONFIG_PREFIX=$DESTDIR CC=/build/musl/bin/musl-gcc install
# Self-check: a glibc-linked result would carry glibc's tunables strings.
if strings "$DESTDIR/bin/busybox" | grep -q 'glibc\.malloc'; then
    echo "busybox was linked against glibc, not musl" >&2
    exit 1
fi
'''
