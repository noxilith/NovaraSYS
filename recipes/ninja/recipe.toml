name        = "ninja"
version     = "1.13.2"
description = "Ninja build system (static)"
license     = "Apache-2.0"
libc        = ["musl"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "musl", "linux-headers", "python"]

[[source]]
url    = "https://github.com/ninja-build/ninja/archive/refs/tags/v1.13.2.tar.gz"
sha256 = "974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17"

[build]
compile = "CXX=g++ CC=gcc LDFLAGS=-static python3 configure.py --bootstrap"
install = '''
mkdir -p "$DESTDIR/usr/bin"
install -m 755 ninja "$DESTDIR/usr/bin/ninja"
strip "$DESTDIR/usr/bin/ninja"
test -x "$DESTDIR/usr/bin/ninja"
'''
