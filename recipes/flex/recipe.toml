name        = "flex"
version     = "2.6.4"
description = "Fast lexical analyzer generator"
license     = "BSD-2-Clause-flex"
libc        = ["musl"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "musl", "linux-headers", "m4"]

[[source]]
url    = "https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz"
sha256 = "e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995"

[build]
configure = "M4=/usr/bin/m4 ./configure --prefix=/usr --disable-nls --disable-shared --enable-static --disable-dependency-tracking CFLAGS='-O2 -std=gnu17' LDFLAGS=--static"
compile   = "make -j$JOBS"
install   = '''
make DESTDIR=$DESTDIR install
rm -rf "$DESTDIR/usr/share/info" "$DESTDIR/usr/share/man" "$DESTDIR/usr/share/doc"
strip "$DESTDIR/usr/bin/flex"
test -x "$DESTDIR/usr/bin/flex"
'''
