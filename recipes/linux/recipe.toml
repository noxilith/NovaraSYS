# The Linux kernel for the live ISO and for installed systems.
#
# PURE: built with `--tools store`, i.e. only with packages (gcc, binutils, make, flex, bison, m4, bc, perl,
# libelf, openssl, kmod, bash, zlib, pkgconf...) and nothing from the build host. (It used to need the host's
# compiler and bc, perl, libelf and OpenSSL headers: that is what packaging them removed.) The kernel does not
# link against a libc, so musl vs glibc only decides which repository the result belongs to.
#
# Configuration: x86_64 defconfig plus the virtual-machine drivers (kvm_guest), with
# everything the live system needs to reach its root made built in, so the initramfs
# needs no modules. The rest of defconfig's drivers stay modules, and are installed.
#
# Result: /boot/vmlinuz-$release, /boot/config-$release, /usr/lib/modules/$release (/lib/modules links to it).
name        = "linux"
version     = "7.3.3_r1"
description = "Linux kernel 7.3 (defconfig base, boot drivers built in, every other driver as a module)"
license     = "GPL-2.0 WITH Linux-syscall-note"
libc        = ["musl"]

[depends]
build = ["busybox", "make", "binutils", "gcc", "musl", "linux-headers", "bc", "perl", "libelf", "flex", "bison", "m4", "zlib", "pkgconf", "bash", "openssl", "kmod"]

[[source]]
url    = "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.3.3.tar.xz"
sha256 = "79c66dde66cd96877fcde8f7d36aec946b1f423d2b97b5a7b1751b75c764f3d1"

[build]
configure = '''
sh "$RECIPE_DIR/full-config.sh" full
'''
compile = "sh \"$RECIPE_DIR/kernel-build.sh\" compile"
install = "sh \"$RECIPE_DIR/kernel-build.sh\" install"
